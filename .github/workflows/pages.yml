# Publishes the site/ folder to GitHub Pages on every push to main.
name: Deploy NightOS

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly, so the Flathub list in App Center stays fresh.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Fresh list of Flathub apps for App Center's Flatpak tab. Keeps the committed copy if Flathub is down.
      - name: Refresh Flathub list
        run: python3 .github/scripts/flathub-snapshot.py site/store/flathub.json || echo "Kept the old Flathub list"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
