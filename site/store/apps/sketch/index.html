<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Sketch</title>
<style>
  :root { --bg: #0b0d16; --bar: #161925; --fg: #e8eaf4; --dim: #9096ad; --line: rgba(255,255,255,.08); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--bar); border-bottom: 1px solid var(--line); z-index: 2; overflow-x: auto; }
  .sw { width: 26px; height: 26px; border-radius: 50%; border: 0; cursor: pointer; flex: none; box-shadow: 0 0 10px var(--g); }
  .sw.on { outline: 2px solid #fff; outline-offset: 2px; }
  .grp { display: flex; gap: 8px; align-items: center; flex: none; }
  label { color: var(--dim); font-size: 12.5px; display: flex; gap: 8px; align-items: center; }
  input[type=range] { width: 110px; accent-color: #9aa8ff; }
  button.t { height: 32px; padding: 0 12px; border-radius: 8px; border: 0; background: rgba(255,255,255,.08); color: var(--fg); cursor: pointer; font: inherit; flex: none; }
  button.t:hover { background: rgba(255,255,255,.14); }
  button.t.on { background: #9aa8ff; color: #0b0d16; font-weight: 700; }
  canvas { position: absolute; left: 0; top: 52px; width: 100%; height: calc(100% - 52px); touch-action: none; cursor: crosshair; }
  .sp { flex: 1; }
</style>
</head>
<body>
<div class="bar">
  <div class="grp" id="colors"></div>
  <label>Size <input type="range" id="size" min="2" max="60" value="10"></label>
  <label>Glow <input type="range" id="glow" min="0" max="40" value="16"></label>
  <div class="grp"><button class="t on" id="brush">Brush</button><button class="t" id="erase">Eraser</button></div>
  <span class="sp"></span>
  <div class="grp"><button class="t" id="undo">Undo</button><button class="t" id="clear">Clear</button><button class="t" id="save">Save PNG</button></div>
</div>
<canvas id="c"></canvas>
<script>
'use strict';
// Night Sketch: strokes are kept as vectors so the drawing can be undone and redrawn at any size.
const COLORS = ['#f5f0dc', '#ffd166', '#ff8fab', '#b493f2', '#7cc4f0', '#6fd08c', '#f4a259', '#ffffff'];
const cv = document.getElementById('c'), g = cv.getContext('2d');
let DPR = 1, color = COLORS[0], erase = false, strokes = [], cur = null;
const $ = id => document.getElementById(id);
COLORS.forEach((c, i) => { const b = document.createElement('button'); b.className = 'sw' + (i ? '' : ' on'); b.style.background = c; b.style.setProperty('--g', c + '88'); b.setAttribute('aria-label', 'Color ' + c); b.onclick = () => { color = c; erase = false; document.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); setTool(); }; $('colors').append(b); });
function setTool() { $('brush').classList.toggle('on', !erase); $('erase').classList.toggle('on', erase); }
$('brush').onclick = () => { erase = false; setTool(); };
$('erase').onclick = () => { erase = true; setTool(); };
$('undo').onclick = () => { strokes.pop(); redraw(); };
$('clear').onclick = () => { strokes = []; redraw(); };
$('save').onclick = () => {
  const out = document.createElement('canvas'); out.width = cv.width; out.height = cv.height; const o = out.getContext('2d');
  paintBg(o, out.width, out.height); o.drawImage(cv, 0, 0);
  const a = document.createElement('a'); a.href = out.toDataURL('image/png'); a.download = 'night-sketch.png'; a.click();
};
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); strokes.pop(); redraw(); } });
function paintBg(c, w, h) { const gr = c.createRadialGradient(w * .5, h * .4, 0, w * .5, h * .4, Math.max(w, h) * .8); gr.addColorStop(0, '#151a33'); gr.addColorStop(1, '#070811'); c.fillStyle = gr; c.fillRect(0, 0, w, h); }
function resize() { DPR = Math.min(devicePixelRatio || 1, 2); const r = cv.getBoundingClientRect(); cv.width = r.width * DPR; cv.height = r.height * DPR; redraw(); }
function drawStroke(s) {
  if (s.pts.length < 1) return;
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  if (s.erase) { g.globalCompositeOperation = 'destination-out'; g.shadowBlur = 0; }
  else { g.shadowColor = s.color; g.shadowBlur = s.glow * DPR; }
  g.strokeStyle = s.erase ? '#000' : s.color; g.lineWidth = s.size * DPR;
  g.beginPath(); g.moveTo(s.pts[0][0] * DPR, s.pts[0][1] * DPR);
  for (let i = 1; i < s.pts.length - 1; i++) { const [x, y] = s.pts[i], [nx, ny] = s.pts[i + 1]; g.quadraticCurveTo(x * DPR, y * DPR, (x + nx) / 2 * DPR, (y + ny) / 2 * DPR); }
  const l = s.pts[s.pts.length - 1]; g.lineTo(l[0] * DPR, l[1] * DPR); g.stroke(); g.restore();
}
function redraw() { g.clearRect(0, 0, cv.width, cv.height); strokes.forEach(drawStroke); if (cur) drawStroke(cur); cv.style.background = 'radial-gradient(circle at 50% 40%, #151a33, #070811)'; }
const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); cur = { pts: [pos(e)], color, size: +$('size').value, glow: +$('glow').value, erase }; redraw(); });
cv.addEventListener('pointermove', e => { if (!cur) return; cur.pts.push(pos(e)); redraw(); });
const end = () => { if (cur) { strokes.push(cur); cur = null; redraw(); } };
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
addEventListener('resize', resize); resize();
</script>
</body>
</html>
